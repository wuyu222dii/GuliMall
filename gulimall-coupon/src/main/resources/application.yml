spring:
  datasource:
    username: ${DB_USER:gulimall}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/gulimall_sms_demo?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:18848}
  application:
    name: gulimall-coupon
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
server:
  address: 127.0.0.1
  port: 7001
