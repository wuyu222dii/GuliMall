spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:gulimall}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 3000
    listener:
      simple:
        acknowledge-mode: manual
        missing-queues-fatal: false
        prefetch: 1
  datasource:
    username: ${DB_USER:gulimall}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/gulimall_wms_demo?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:18848}
  application:
    name: gulimall-ware
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
server:
  address: 127.0.0.1
  port: 11000
logging:
  level:
    com.atguigu: debug
