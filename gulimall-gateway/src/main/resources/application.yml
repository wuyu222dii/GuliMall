server:
  address: 127.0.0.1
  port: 88
spring:
  application:
    name: gulimall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:18848}
    gateway:
      routes:
        - id: local_media
          uri: lb://gulimall-third-party
          predicates:
            - Path=/api/media/**
            - Method=GET
          filters:
            - StripPrefix=1
        - id: authentication
          uri: lb://gulimall-auth-server
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: catalog
          uri: lb://gulimall-product
          predicates:
            - Path=/api/product/catalog
            - Method=GET
          filters:
            - RewritePath=/api/product/catalog,/index/catalog.json
        - id: product_read
          uri: lb://gulimall-product
          predicates:
            - Path=/api/product/items,/api/product/items/**,/api/product/categories,/api/product/brands
            - Method=GET
          filters:
            - StripPrefix=1
        - id: member_addresses
          uri: lb://gulimall-member
          predicates:
            - Path=/api/member/addresses,/api/member/addresses/**
          filters:
            - StripPrefix=1
        - id: member_orders
          uri: lb://gulimall-order
          predicates:
            - Path=/api/order/mine,/api/order/mine/**
            - Method=GET
          filters:
            - StripPrefix=1
        - id: member_payment
          uri: lb://gulimall-order
          predicates:
            - Path=/api/order/pay
            - Method=GET
          filters:
            - RewritePath=/api/order/pay,/aliPayOrder
        - id: stock_read
          uri: lb://gulimall-ware
          predicates:
            - Path=/api/ware/waresku/hasstock
            - Method=POST
          filters:
            - StripPrefix=1
        - id: marketing_read
          uri: lb://gulimall-coupon
          predicates:
            - Path=/api/coupon/homeadv/list,/api/coupon/homesubject/list
            - Method=GET
          filters:
            - StripPrefix=1
        - id: search
          uri: lb://gulimall-search
          predicates:
            - Path=/api/search
            - Method=GET
          filters:
            - StripPrefix=1
        - id: admin_product
          uri: lb://gulimall-product
          predicates:
            - Path=/api/admin/product/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*),/$\{segment}

        - id: admin_member
          uri: lb://gulimall-member
          predicates:
            - Path=/api/admin/member/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*),/$\{segment}

        - id: admin_ware
          uri: lb://gulimall-ware
          predicates:
            - Path=/api/admin/ware/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*),/$\{segment}

        - id: admin_coupon
          uri: lb://gulimall-coupon
          predicates:
            - Path=/api/admin/coupon/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*),/$\{segment}

        - id: admin_order
          uri: lb://gulimall-order
          predicates:
            - Path=/api/admin/order/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*),/$\{segment}

        - id: admin_search
          uri: lb://gulimall-search
          predicates:
            - Path=/api/admin/search/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*),/$\{segment}
        - id: admin_thirdparty
          uri: lb://gulimall-third-party
          predicates:
            - Path=/api/admin/thirdparty/**
          filters:
            - RewritePath=/api/admin/thirdparty/(?<segment>.*),/$\{segment}
