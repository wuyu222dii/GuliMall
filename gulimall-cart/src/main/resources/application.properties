spring.application.name=gulimall-cart
server.address=127.0.0.1
server.port=18000
spring.cloud.nacos.discovery.server-addr=${NACOS_ADDR:127.0.0.1:18848}
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=0
spring.redis.timeout=2000
spring.jackson.deserialization.accept-float-as-int=false
feign.client.config.gulimall-product.connectTimeout=2000
feign.client.config.gulimall-product.readTimeout=10000
