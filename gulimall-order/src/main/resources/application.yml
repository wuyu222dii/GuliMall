spring:
  datasource:
    username: ${DB_USER:gulimall}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/gulimall_oms_demo?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:18848}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:gulimall}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirms: true
    publisher-returns: true
    connection-timeout: 3000
    listener:
      simple:
        acknowledge-mode: manual
        missing-queues-fatal: false
        prefetch: 1
  application:
    name: gulimall-order
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
server:
  address: 127.0.0.1
  port: 9000

alipay:
  app_id: ${ALIPAY_APP_ID:}
  merchant_private_key: ${ALIPAY_PRIVATE_KEY:}
  alipay_public_key: ${ALIPAY_PUBLIC_KEY:}
  seller_id: ${ALIPAY_SELLER_ID:}
  notify_url: ${ALIPAY_NOTIFY_URL:}
  return_url: ${ALIPAY_RETURN_URL:http://127.0.0.1:5173/payment/return}
  gatewayUrl: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
